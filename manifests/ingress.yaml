apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todo-get-task
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
spec:
  ingressClassName: azure-application-gateway
  rules:
  - host: get-task.rajnish.store.
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: todo-get-task
            port: 
              number: 80
